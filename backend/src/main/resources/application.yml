# 服务端口
server:
  port: 4987

spring:
  application:
    name: campus-activity
  # 数据源：真实密码放环境变量 DB_PASSWORD（配置文件只留占位符，绝不入库）
  # ${VAR:默认值} 语法：启动时先找环境变量，找不到才用冒号后的默认值
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # 文件上传限制：单个文件 / 单次请求最大 10MB，防止超大文件拖垮服务
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis 配置
mybatis:
  configuration:
    # 下划线转驼峰：表字段 create_time -> 实体属性 createTime，省去手写映射
    map-underscore-to-camel-case: true
    # 控制台打印执行的 SQL 和参数，方便调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志：INFO 级别，能看到启动信息和 MyBatis 的 SQL 输出
logging:
  level:
    com.example.campus_activity: info

# 文件上传目录：默认放在用户主目录下 —— 任何机器都存在，且不受「从哪个工作目录启动」影响
# （IDEA 从 backend/ 启动、命令行从项目根启动，解析出来的绝对路径都一样）
# 想换位置就设环境变量 UPLOAD_PATH，例如 UPLOAD_PATH=D:/xxx/uploads/
upload:
  path: ${UPLOAD_PATH:${user.home}/campus-activity-uploads/}
